# Overlay that publishes the server's ports on the host. Needed by everything that runs
# as a plain node process on the runner rather than inside the Docker network: the two
# seeders (e2e/seed/seed-states.js, seed-users.js) and mibi-portal-server's integration
# test suite (jest). The workflow therefore always includes it; locally you can drop it
# if you only want the Welcome-page smoke test. Use together with the base file:
#
#   docker compose -f e2e/docker-compose.yml -f e2e/docker-compose.integration.yml up -d --build --wait
#
# The base stack deliberately publishes no host port for the server — Cypress reaches it
# through the client container over the Docker network, and not publishing avoids clashing
# with a local dev server on :3000. Published here:
#
#   3000  the API the integration tests call (matches `apiUrl` in config/local-test.json)
#   1337  Parse, mounted at /admin/parse — used by seed-states.js and seed-users.js
#
# Keep this out of the base file so a plain Cypress run stays port-conflict free.

services:
  server:
    ports:
      - "3000:3000"
      - "1337:1337"
