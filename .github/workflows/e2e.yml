# End-to-end tests in GitHub Actions — Dockerized stack, MANUAL trigger.
#
# Design: bring the whole MiBi-Portal stack up as containers inside the runner,
# seed MongoDB from e2e/seed/seed-data.js.gz, then run the Cypress suite against localhost.
# Nothing here touches the BfR intranet, so the firewall is not involved.
#
# The seed file is not in the repo. Set the repository secret E2E_SEED_URL to a URL that
# serves it, otherwise Mongo starts empty and only the Welcome-page smoke test can pass.
# See e2e/README.md, "Providing the seed to CI".

name: E2E (Docker)

# "Run by clicking a button" -> workflow_dispatch (manual only; no push/schedule).
on:
  workflow_dispatch:
    inputs:
      client_ref:
        description: "mibi-portal-client branch/tag (has the Cypress specs)"
        default: "develop"
        required: true
      server_ref:
        description: "mibi-portal-server branch/tag"
        default: "develop"
        required: true
      cloud_ref:
        description: "mibi-parse-cloud branch/tag"
        default: "develop"
        required: true
      spec:
        description: "Cypress spec glob (blank = full suite)"
        # Blank: the whole suite runs (package.json "test:e2e"). All specs pass against the
        # seeded stack; the only pending ones are the upload blocks their authors disabled
        # with xdescribe ("FIXME: Upload is not working yet").
        default: ""
        required: false
      run_integration_tests:
        description: "Also run mibi-portal-server's API integration suite (jest)"
        type: boolean
        default: true
      run_cypress:
        description: "Run the Cypress UI suite"
        type: boolean
        default: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Every `docker compose` call in this job uses the same file set, so teardown and
      # log collection stay correct no matter which step failed.
      #
      # The integration overlay is always included: it only publishes the server's
      # 3000/1337 on the host, and the seeders (seed-users.js, seed-states.js) are plain
      # node processes on the runner that talk to Parse on 1337. Port clashes are a local
      # concern, not a runner one — locally, add the overlay only while seeding.
      COMPOSE_FILES: "-f e2e/docker-compose.yml -f e2e/docker-compose.integration.yml"

      # Parse credentials for the seeders. These are NOT secrets and must not be taken
      # from any: they have to match the values baked into e2e/docker/Dockerfile.server,
      # which node-config cannot take from the environment. A mismatch means every
      # seeding call gets a 403.
      PARSE_URL: http://localhost:1337/admin/parse
      PARSE_APP_ID: appId
      PARSE_MASTER_KEY: masterKey

    steps:
      # --- 1. Get all three services' source (client repo is the one running this workflow) ---
      - name: Checkout client
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.client_ref }}
          path: mibi-portal-client

      - name: Checkout server
        uses: actions/checkout@v5
        with:
          repository: SiLeBAT/mibi-portal-server
          ref: ${{ inputs.server_ref }}
          path: mibi-portal-server
          # TODO: if the repo is private, add: token: ${{ secrets.GH_PAT }}

      - name: Checkout parse-cloud
        uses: actions/checkout@v5
        with:
          repository: SiLeBAT/mibi-parse-cloud
          ref: ${{ inputs.cloud_ref }}
          path: mibi-parse-cloud
          # TODO: if private, add: token: ${{ secrets.GH_PAT }}

      # --- 2. The seed data (reference data + scrubbed institutions) ---
      #     Committed at e2e/seed/seed-data.js.gz, so it arrives with the checkout and this
      #     step only reports what is there. Setting the repository secret E2E_SEED_URL
      #     overrides it with a download, which is a way to try a refreshed seed without
      #     committing one. With no seed at all Mongo starts empty and only the
      #     Welcome-page smoke test can pass. See e2e/README.md.
      - name: Seed data
        env:
          E2E_SEED_URL: ${{ secrets.E2E_SEED_URL }}
        run: |
          cd mibi-portal-client
          if [ -n "$E2E_SEED_URL" ]; then
            curl -sSLf "$E2E_SEED_URL" -o e2e/seed/seed-data.js.gz
            echo "Seed downloaded from E2E_SEED_URL: $(du -h e2e/seed/seed-data.js.gz | cut -f1)"
          elif [ -f e2e/seed/seed-data.js.gz ]; then
            echo "Seed from the repository: $(du -h e2e/seed/seed-data.js.gz | cut -f1)"
            ls -la e2e/seed/files || echo "::warning::No e2e/seed/files — Excel/submission creation will fail."
          else
            echo "::warning::No seed data in the repository and no E2E_SEED_URL — starting Mongo empty. Only the Welcome-page smoke test can pass."
          fi

      # --- 3. Build + start the whole stack ---
      #     Mongo loads e2e/seed/seed-data.js.gz on first boot via its init hook
      #     (e2e/mongo/restore.sh); the volume is fresh in CI, so the hook always runs.
      #     The integration overlay publishes the server's 3000/1337 on the host so the
      #     seeders and the jest suite — plain node processes on the runner — can reach
      #     the API and Parse.
      - name: Bring up the stack
        working-directory: mibi-portal-client
        run: |
          docker compose $COMPOSE_FILES up -d --build --wait
          docker compose $COMPOSE_FILES ps

      # --- 4. Seed the reference data the validation rules read at runtime ---
      #     The seed already contains `states`, in which case this is a no-op (the script
      #     skips when rows exist). It still runs, so a seed-less run has at least the
      #     AVV id format regexes: without the `states` class the format rule (error 72)
      #     has an empty regex list and silently checks nothing.
      - name: Seed states
        working-directory: mibi-portal-client
        run: node e2e/seed/seed-states.js

      # --- 4b. Seed the test accounts ---
      #     Not part of the seed data: the `users` class stores argon2 password hashes,
      #     and the specs log in with the plaintext passwords from
      #     cypress/fixtures/users.json. See e2e/seed/seed-users.js.
      - name: Seed users
        working-directory: mibi-portal-client
        run: node e2e/seed/seed-users.js

      # --- 5. Run mibi-portal-server's API integration suite against the stack ---
      - name: Set up Node for the integration suite
        if: ${{ inputs.run_integration_tests }}
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mibi-portal-server/package-lock.json

      - name: Install server dependencies
        if: ${{ inputs.run_integration_tests }}
        working-directory: mibi-portal-server
        run: npm ci

      - name: Integration tests
        if: ${{ inputs.run_integration_tests }}
        working-directory: mibi-portal-server
        env:
          # jest sets NODE_ENV=test, so node-config picks up config/local-test.json,
          # whose apiUrl is http://localhost:3000 — the port the overlay publishes.
          NODE_ENV: test
        # --runInBand: with jest's worker processes, a failing test that carries an axios
        # error crashes the worker while serializing it ("Converting circular structure to
        # JSON") and the real assertion never gets reported. A green run looks the same
        # either way; a red one is only readable single-process.
        run: npm run test:integration -- --runInBand

      # --- 6. Run the Cypress E2E suite against the running stack ---
      - name: Cypress run
        if: ${{ inputs.run_cypress }}
        uses: cypress-io/github-action@v6
        with:
          working-directory: mibi-portal-client
          # The app is served by the client container; wait for it before starting.
          wait-on: "http://localhost:4200"
          wait-on-timeout: 180
          # Blank spec => the package.json "test:e2e" default glob runs.
          command: ${{ inputs.spec == '' && 'npm run test:e2e' || format('npx cypress run --spec {0}', inputs.spec) }}
        env:
          CYPRESS_BASE_URL: http://localhost:4200

      # --- 7. Always collect artifacts + logs, then tear the stack down ---
      - name: Upload Cypress report & screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-report
          path: |
            mibi-portal-client/cypress/reports
            mibi-portal-client/cypress/screenshots
          if-no-files-found: ignore

      - name: Stack logs (on failure)
        if: failure()
        working-directory: mibi-portal-client
        run: docker compose ${{ env.COMPOSE_FILES }} logs --no-color

      - name: Tear down
        if: always()
        working-directory: mibi-portal-client
        run: docker compose ${{ env.COMPOSE_FILES }} down -v
