<div class="mibi-order-results">
    <div class="mibi-order-results__bar">
        <div class="mibi-order-results__meta">
            <span class="mibi-order-results__date">{{ createdAt | date: 'dd.MM.yyyy HH:mm' }}</span>
            <span class="mibi-order-results__file">{{ order?.fileName }}</span>
        </div>
        <!-- Placeholder stub; download functionality is added in Phase F. -->
        <button
            class="mibi-order-results__download"
            type="button"
        >Ergebnisse Herunterladen</button>
    </div>

    <div class="mibi-order-results__content">
        @if (model) {
            <mibi-samples-grid-view [model]="model"></mibi-samples-grid-view>
        }
    </div>
</div>
